# Solace (0.18-dev) - shader settings
oldLighting=false
separateAo=true
clouds=off
# SOFT_CLOUDS draws its own clouds in the sky pass; vanilla cloud geometry is hidden in gbuffers_clouds
sun=false
moon=false
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off

profile.LOW=CEL_BANDS=2 !SHADOWS SHADOW_SOFTNESS=0 shadowMapResolution=512 !WATER_WAVES !WATER_SPARKLE OUTLINE_FADE=64.0 !BLOOM !GODRAYS
profile.MEDIUM=CEL_BANDS=3 SHADOWS SHADOW_SOFTNESS=1 shadowMapResolution=1024 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=128.0 BLOOM GODRAYS
profile.HIGH=CEL_BANDS=4 SHADOWS SHADOW_SOFTNESS=2 shadowMapResolution=2048 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=160.0 BLOOM GODRAYS

screen=<profile> <empty> [LIGHTING] [OUTLINE] [COLOR] [SKY] [WATER]
screen.LIGHTING=WAVING_FOLIAGE WAVING_STRENGTH TORCH_STRENGTH CEL_BANDS CEL_EDGE SHADOWS SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_TINT_R SHADOW_TINT_G SHADOW_TINT_B
screen.OUTLINE=LIGHT_OUTLINES LIGHT_OUTLINE_OPACITY EDGE_STYLE SOFT_EDGE_STRENGTH OUTLINES OUTLINE_NORMALS INNER_STRENGTH INNER_FADE OUTLINE_THICKNESS OUTLINE_STRENGTH OUTLINE_FADE OUTLINE_R OUTLINE_G OUTLINE_B
screen.COLOR=BIOME_MOOD EMISSIVE_BLOCKS EMISSIVE_STRENGTH STYLE GRASS_SMOOTH FOLIAGE_SMOOTH HIDE_LEAF_LITTER GROUND_GRADE GROUND_GRADE_STRENGTH GRASS_SWAY GRASS_SWAY_SPEED AMBIENT_BOOST FOLIAGE_LIME SCENE_TINT DUSK_TINT BLOOM BLOOM_STRENGTH GODRAYS GODRAYS_STRENGTH CANOPY_GLOW HAZE SAND_BOOST SATURATION WARM_SAT_LIMIT LUMA_CAP VIBRANCE LIME_GREENS WARMTH
screen.SKY=HORIZON_HAZE SKY_SUN_GLOW DUSK_SKY FOG_SKY_MATCH MORNING_MIST BIOME_FOG SOFT_CLOUDS CLOUD_COVER SKY_BANDS DISTANCE_FOG FOG_STRENGTH
screen.WATER=WATER_FOAM_AMT WATER_CLARITY WATER_REFLECT WATER_BRIGHT WATER_SAT WATER_OPACITY WATER_DEPTH_TINT WATER_WAVES WATER_FOAM WATER_SPARKLE UNDERWATER_FOG
sliders=HORIZON_HAZE WATER_FOAM_AMT SKY_SUN_GLOW DUSK_SKY FOG_SKY_MATCH MORNING_MIST BIOME_FOG WATER_CLARITY WATER_REFLECT BIOME_MOOD EMISSIVE_STRENGTH WAVING_STRENGTH LIGHT_OUTLINE_OPACITY CLOUD_COVER TORCH_STRENGTH GRASS_SMOOTH FOLIAGE_SMOOTH WATER_BRIGHT GROUND_GRADE_STRENGTH GRASS_SWAY GRASS_SWAY_SPEED WATER_SAT WATER_OPACITY WATER_DEPTH_TINT SOFT_EDGE_STRENGTH INNER_STRENGTH INNER_FADE GODRAYS_STRENGTH CANOPY_GLOW AMBIENT_BOOST FOLIAGE_LIME SCENE_TINT DUSK_TINT BLOOM_STRENGTH HAZE SAND_BOOST CEL_BANDS CEL_EDGE SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_TINT_R SHADOW_TINT_G SHADOW_TINT_B OUTLINE_THICKNESS OUTLINE_STRENGTH OUTLINE_FADE OUTLINE_R OUTLINE_G OUTLINE_B SATURATION WARM_SAT_LIMIT LUMA_CAP VIBRANCE LIME_GREENS WARMTH SKY_BANDS FOG_STRENGTH UNDERWATER_FOG
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_basic.colortex2=off

# smoothed biome inputs for biome mood (seconds to fade in/out)
uniform.float.bTemp=smooth(temperature, 6, 6)
uniform.float.bRain=smooth(rainfall, 6, 6)
uniform.float.bSwamp=smooth(if(biome_category == CAT_SWAMP, 1.0, 0.0), 6, 6)
uniform.float.bDark=smooth(if(biome == BIOME_DARK_FOREST, 1.0, 0.0), 6, 6)
