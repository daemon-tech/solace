screen.OUTLINE=EDGE_STYLE OUTLINES OUTLINE_THICKNESS OUTLINE_STRENGTH LIGHT_OUTLINES LIGHT_OUTLINE_OPACITY [OUTLINE_ADV]
screen.OUTLINE_ADV=SOFT_EDGE_STRENGTH OUTLINE_NORMALS INNER_STRENGTH INNER_FADE OUTLINE_FADE OUTLINE_R OUTLINE_G OUTLINE_B EDGE_KERNEL GRASS_LEDGE_LINES
screen.WORLD=NETHER_FOG END_FOG
screen.columns=2
sliders=CAVE_HAZE GRASS_PART AERIAL_PERSPECTIVE BOUNCE_LIGHT SHORE_FOAM SUN_SPOTS RAINBOW SOFT_STARS DUSK_WATER_GLOW MOUNTAIN_LAYERS WARM_COOL MOON_HALO WATER_PAINTERLY_K CANOPY_RAYS WIND_STREAKS DRIFT_LEAVES LEAF_GLINTS LANTERN_SWAY FLAME_FLICKER GRASS_GRADIENT CHAR_RIM SKY_BRIGHT PAINTERLY_FAR FIELD_WAVES GOLDEN_RIM_STRENGTH HELD_LIGHT_STRENGTH LAVA_BRIGHT TEXTURE_CALM FAR_SOFTEN ENTITY_SOFT VALLEY_FOG VALLEY_FOG_HEIGHT RIM_STRENGTH RIM_WIDTH CLOUD_LAYER_SPEED SOFT_GRASS_STRENGTH SHADOW_FILTER_SIZE SHADOW_PENUMBRA GLOW_SHALLOWS_AMT LIGHT_HALO SUN_HALO RAIN_STREAKS FOREST_RAYS FOREST_HAZE FOLIAGE_CONTRAST DISTANCE_BLUR_STRENGTH LEAF_TRANSLUCENCY NIGHT_GLOW NETHER_FOG END_FOG CAUSTICS_STRENGTH UNDERWATER_RAYS GLASS_REFLECT_STRENGTH SHADOW_DIST_SOFT TIME_GRADING_STRENGTH DISTANCE_BLUE RAIN_FOG SANDSTORM WET_GROUND_STRENGTH MILKY_WAY WATER_SPLASH_AMT SSAO_STRENGTH CLOUD_SHADOW_STRENGTH VOLUMETRIC_OUTDOOR WATER_SSR_STRENGTH WIND_GUST_STRENGTH WIND_SPEED WIND_SHEEN GOLDEN_HOUR_TINT SHADOW_EDGE COLORED_LIGHT_STRENGTH CAVE_FOG_DENSITY LIGHT_SHAFTS_STRENGTH HORIZON_HAZE WATER_FOAM_AMT SKY_SUN_GLOW DUSK_SKY FOG_SKY_MATCH MORNING_MIST BIOME_FOG WATER_CLARITY WATER_REFLECT BIOME_MOOD EMISSIVE_STRENGTH WAVING_STRENGTH LIGHT_OUTLINE_OPACITY CLOUD_COVER TORCH_STRENGTH GRASS_SMOOTH FOLIAGE_SMOOTH WATER_BRIGHT GROUND_GRADE_STRENGTH GRASS_SWAY GRASS_SWAY_SPEED WATER_SAT WATER_OPACITY WATER_DEPTH_TINT SOFT_EDGE_STRENGTH INNER_STRENGTH INNER_FADE GODRAYS_STRENGTH CANOPY_GLOW AMBIENT_BOOST FOLIAGE_LIME SCENE_TINT DUSK_TINT BLOOM_STRENGTH HAZE SAND_BOOST CEL_BANDS CEL_EDGE SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_TINT_R SHADOW_TINT_G SHADOW_TINT_B OUTLINE_THICKNESS OUTLINE_STRENGTH OUTLINE_FADE OUTLINE_R OUTLINE_G OUTLINE_B SATURATION WARM_SAT_LIMIT LUMA_CAP VIBRANCE LIME_GREENS WARMTH SKY_BANDS FOG_STRENGTH UNDERWATER_FOG NIGHT_LIGHT_REFLECT_STRENGTH WATER_STARS_STRENGTH WATER_ROLL_HEIGHT FIREFLY_AMOUNT BIOME_SKY
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_basic.colortex2=off

# smoothed biome inputs for biome mood (seconds to fade in/out)
uniform.float.bTemp=smooth(temperature, 6, 6)
uniform.float.bRain=smooth(rainfall, 6, 6)
uniform.float.bSwamp=smooth(if(biome_category == CAT_SWAMP, 1.0, 0.0), 6, 6)
uniform.float.bDark=smooth(if(biome == BIOME_DARK_FOREST, 1.0, 0.0), 6, 6)
uniform.float.bCherry=smooth(if(biome == BIOME_CHERRY_GROVE, 1.0, 0.0), 6, 6)
# biome sky weights (own names, used by lib/sky.glsl)
uniform.float.sbHot=smooth(if(temperature > 1.4 && rainfall < 0.2 && biome_category != CAT_MESA, 1.0, 0.0), 6, 6)
uniform.float.sbMesa=smooth(if(biome_category == CAT_MESA, 1.0, 0.0), 6, 6)
uniform.float.sbCold=smooth(if(temperature < 0.2, 1.0, 0.0), 6, 6)
uniform.float.sbSwamp=smooth(if(biome_category == CAT_SWAMP, 1.0, 0.0), 6, 6)
uniform.float.sbJungle=smooth(if(biome_category == CAT_JUNGLE, 1.0, 0.0), 6, 6)
uniform.float.sbCherry=smooth(if(biome == BIOME_CHERRY_GROVE, 1.0, 0.0), 6, 6)
uniform.float.lFlash=smooth(if(lightningBoltPosition.w > 0.5, 1.0, 0.0), 0.03, 1.5)
# wake map: world-anchored trail history (256x256 = 64x64 blocks) + one state row
size.buffer.colortex6=256 257
blend.gbuffers_terrain.colortex3=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_hand.colortex3=off
blend.gbuffers_textured.colortex3=off
blend.gbuffers_water.colortex3=off

blend.gbuffers_terrain.colortex4=off
blend.gbuffers_entities.colortex4=off
blend.gbuffers_hand.colortex4=off
blend.gbuffers_textured.colortex4=off
blend.gbuffers_basic.colortex4=off
blend.gbuffers_water.colortex4=off
