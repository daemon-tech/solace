screen.FOLIAGE_ADV=WIND_SPEED WIND_SHEEN GRASS_SWAY GRASS_SWAY_SPEED GRASS_TONE GRASS_SMOOTH FOLIAGE_SMOOTH FOLIAGE_CONTRAST FOLIAGE_LIME LEAF_TRANSLUCENCY CANOPY_GLOW GROUND_GRADE GROUND_GRADE_STRENGTH HIDE_LEAF_LITTER
screen.COLOR=VIBRANCE WARMTH BIOME_MOOD TEXTURE_CALM [COLOR_ADV]
screen.COLOR_ADV=SCENE_TINT DUSK_TINT WARM_SAT_LIMIT LUMA_CAP LIME_GREENS SAND_BOOST
