shadowTranslucent=true
# Solace (0.23-dev) - shader settings
oldLighting=false
separateAo=true
clouds=fancy
# Cloud style: cubic block clouds by default (gbuffers_clouds); SOFT_CLOUDS switches to painted sky-plane clouds
sun=false
moon=false
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off

profile.LOW=CEL_BANDS=2 !SHADOW_TEMPORAL !SHADOW_FILTER !SHADOWS SHADOW_SOFTNESS=0 shadowMapResolution=512 !WATER_WAVES !WATER_SPARKLE OUTLINE_FADE=64.0 !BLOOM !GODRAYS !SSAO !CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=0.0 !WATER_SSR !CAUSTICS !FXAA !WET_GROUND
profile.MEDIUM=CEL_BANDS=3 SHADOW_TEMPORAL SHADOW_FILTER SHADOWS SHADOW_SOFTNESS=2 shadowMapResolution=2048 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=128.0 BLOOM GODRAYS SSAO CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=0.3 WATER_SSR CAUSTICS FXAA WET_GROUND
profile.HIGH=CEL_BANDS=4 SHADOW_TEMPORAL SHADOW_FILTER SHADOWS SHADOW_SOFTNESS=3 shadowMapResolution=4096 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=160.0 BLOOM GODRAYS SSAO CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=0.6 WATER_SSR CAUSTICS FXAA WET_GROUND
profile.ULTRA=CEL_BANDS=4 SHADOW_TEMPORAL SHADOW_FILTER SHADOWS SHADOW_SOFTNESS=3 shadowMapResolution=4096 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=160.0 BLOOM GODRAYS SSAO SSAO_STRENGTH=0.5 CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=1.0 WATER_SSR CAUSTICS FXAA WET_GROUND

screen=<profile> <empty> [LIGHTING] [OUTLINE] [COLOR] [SKY] [WATER]
screen.LIGHTING=SHADOW_TEMPORAL SHADOW_FILTER SHADOW_FILTER_SIZE SHADOW_PENUMBRA LIGHT_HALO SUN_HALO FOREST_RAYS FOREST_HAZE FOLIAGE_CONTRAST FXAA DISTANCE_BLUR DISTANCE_BLUR_STRENGTH LEAF_TRANSLUCENCY NIGHT_GLOW SHADOW_DIST_SOFT SSAO SSAO_STRENGTH CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH VOLUMETRIC_OUTDOOR WIND_GUSTS WIND_GUST_STRENGTH WIND_SPEED WIND_SHEEN GRASS_TONE GOLDEN_HOUR_TINT SHADOW_EDGE COLORED_LIGHT COLORED_LIGHT_STRENGTH LIGHT_SHAFTS LIGHT_SHAFTS_STRENGTH WAVING_FOLIAGE WAVING_STRENGTH TORCH_STRENGTH CEL_BANDS CEL_EDGE SHADOWS SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_TINT_R SHADOW_TINT_G SHADOW_TINT_B
screen.OUTLINE=LIGHT_OUTLINES LIGHT_OUTLINE_OPACITY EDGE_STYLE SOFT_EDGE_STRENGTH OUTLINES OUTLINE_NORMALS INNER_STRENGTH INNER_FADE OUTLINE_THICKNESS OUTLINE_STRENGTH OUTLINE_FADE OUTLINE_R OUTLINE_G OUTLINE_B EDGE_KERNEL GRASS_LEDGE_LINES
screen.COLOR=BIOME_MOOD EMISSIVE_BLOCKS EMISSIVE_STRENGTH STYLE GRASS_SMOOTH FOLIAGE_SMOOTH HIDE_LEAF_LITTER GROUND_GRADE GROUND_GRADE_STRENGTH GRASS_SWAY GRASS_SWAY_SPEED AMBIENT_BOOST FOLIAGE_LIME SCENE_TINT DUSK_TINT BLOOM BLOOM_STRENGTH GODRAYS GODRAYS_STRENGTH CANOPY_GLOW HAZE SAND_BOOST SATURATION WARM_SAT_LIMIT LUMA_CAP VIBRANCE LIME_GREENS WARMTH
screen.SKY=RAIN_STREAKS NETHER_FOG END_FOG TIME_GRADING TIME_GRADING_STRENGTH DISTANCE_BLUE WEATHER_FX RAIN_FOG SANDSTORM WET_GROUND WET_GROUND_STRENGTH MILKY_WAY CAVE_FOG CAVE_FOG_DENSITY HORIZON_HAZE SKY_SUN_GLOW DUSK_SKY FOG_SKY_MATCH MORNING_MIST BIOME_FOG SOFT_CLOUDS CLOUD_COVER SKY_BANDS DISTANCE_FOG FOG_STRENGTH
screen.WATER=WATER_WAKE WATERFALL_BLOBS GLOW_SHALLOWS GLOW_SHALLOWS_AMT SUNSET_STREAK CAUSTICS CAUSTICS_STRENGTH UNDERWATER_RAYS GLASS_REFLECT GLASS_REFLECT_STRENGTH GLASS_TINT_LIGHT WATER_SPLASH WATER_SPLASH_AMT WATER_SSR WATER_SSR_STRENGTH WATER_SUN_GLINT WATER_FOAM_AMT WATER_CLARITY WATER_REFLECT WATER_BRIGHT WATER_SAT WATER_OPACITY WATER_DEPTH_TINT WATER_WAVES WATER_FOAM WATER_SPARKLE UNDERWATER_FOG NIGHT_LIGHT_REFLECT NIGHT_LIGHT_REFLECT_STRENGTH NIGHT_WAKE_BRIGHT WATER_STARS WATER_STARS_STRENGTH WATER_ROLL WATER_ROLL_HEIGHT
sliders=SHADOW_FILTER_SIZE SHADOW_PENUMBRA GLOW_SHALLOWS_AMT LIGHT_HALO SUN_HALO RAIN_STREAKS FOREST_RAYS FOREST_HAZE FOLIAGE_CONTRAST DISTANCE_BLUR_STRENGTH LEAF_TRANSLUCENCY NIGHT_GLOW NETHER_FOG END_FOG CAUSTICS_STRENGTH UNDERWATER_RAYS GLASS_REFLECT_STRENGTH SHADOW_DIST_SOFT TIME_GRADING_STRENGTH DISTANCE_BLUE RAIN_FOG SANDSTORM WET_GROUND_STRENGTH MILKY_WAY WATER_SPLASH_AMT SSAO_STRENGTH CLOUD_SHADOW_STRENGTH VOLUMETRIC_OUTDOOR WATER_SSR_STRENGTH WIND_GUST_STRENGTH WIND_SPEED WIND_SHEEN GOLDEN_HOUR_TINT SHADOW_EDGE COLORED_LIGHT_STRENGTH CAVE_FOG_DENSITY LIGHT_SHAFTS_STRENGTH HORIZON_HAZE WATER_FOAM_AMT SKY_SUN_GLOW DUSK_SKY FOG_SKY_MATCH MORNING_MIST BIOME_FOG WATER_CLARITY WATER_REFLECT BIOME_MOOD EMISSIVE_STRENGTH WAVING_STRENGTH LIGHT_OUTLINE_OPACITY CLOUD_COVER TORCH_STRENGTH GRASS_SMOOTH FOLIAGE_SMOOTH WATER_BRIGHT GROUND_GRADE_STRENGTH GRASS_SWAY GRASS_SWAY_SPEED WATER_SAT WATER_OPACITY WATER_DEPTH_TINT SOFT_EDGE_STRENGTH INNER_STRENGTH INNER_FADE GODRAYS_STRENGTH CANOPY_GLOW AMBIENT_BOOST FOLIAGE_LIME SCENE_TINT DUSK_TINT BLOOM_STRENGTH HAZE SAND_BOOST CEL_BANDS CEL_EDGE SHADOW_SOFTNESS shadowMapResolution shadowDistance SHADOW_TINT_R SHADOW_TINT_G SHADOW_TINT_B OUTLINE_THICKNESS OUTLINE_STRENGTH OUTLINE_FADE OUTLINE_R OUTLINE_G OUTLINE_B SATURATION WARM_SAT_LIMIT LUMA_CAP VIBRANCE LIME_GREENS WARMTH SKY_BANDS FOG_STRENGTH UNDERWATER_FOG NIGHT_LIGHT_REFLECT_STRENGTH WATER_STARS_STRENGTH WATER_ROLL_HEIGHT
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_hand.colortex2=off
blend.gbuffers_textured.colortex2=off
blend.gbuffers_basic.colortex2=off

# smoothed biome inputs for biome mood (seconds to fade in/out)
uniform.float.bTemp=smooth(temperature, 6, 6)
uniform.float.bRain=smooth(rainfall, 6, 6)
uniform.float.bSwamp=smooth(if(biome_category == CAT_SWAMP, 1.0, 0.0), 6, 6)
uniform.float.bDark=smooth(if(biome == BIOME_DARK_FOREST, 1.0, 0.0), 6, 6)
blend.gbuffers_terrain.colortex3=off
blend.gbuffers_entities.colortex3=off
blend.gbuffers_hand.colortex3=off
blend.gbuffers_textured.colortex3=off
blend.gbuffers_water.colortex3=off

blend.gbuffers_terrain.colortex4=off
blend.gbuffers_entities.colortex4=off
blend.gbuffers_hand.colortex4=off
blend.gbuffers_textured.colortex4=off
blend.gbuffers_basic.colortex4=off
blend.gbuffers_water.colortex4=off
