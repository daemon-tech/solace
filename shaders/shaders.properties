shadowTranslucent=true
# Solace (0.33) - shader settings
oldLighting=false
separateAo=true
clouds=fancy
# Cloud style: cubic block clouds by default (gbuffers_clouds); SOFT_CLOUDS switches to painted sky-plane clouds
sun=false
moon=false
blend.gbuffers_water.colortex1=off
blend.gbuffers_water.colortex2=off

profile.LOW=CEL_BANDS=2 !SHADOW_TEMPORAL !SHADOW_FILTER !SHADOWS SHADOW_SOFTNESS=0 shadowMapResolution=512 !WATER_WAVES !WATER_SPARKLE OUTLINE_FADE=64.0 !BLOOM !GODRAYS !SSAO !CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=0.0 !WATER_SSR !CAUSTICS !FXAA !WET_GROUND !FIREFLIES
profile.MEDIUM=CEL_BANDS=3 SHADOW_TEMPORAL SHADOW_FILTER SHADOWS SHADOW_SOFTNESS=2 shadowMapResolution=2048 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=128.0 BLOOM GODRAYS SSAO CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=0.3 WATER_SSR CAUSTICS FXAA WET_GROUND
profile.HIGH=CEL_BANDS=4 SHADOW_TEMPORAL SHADOW_FILTER SHADOWS SHADOW_SOFTNESS=3 shadowMapResolution=4096 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=160.0 BLOOM GODRAYS SSAO CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=0.6 WATER_SSR CAUSTICS FXAA WET_GROUND
profile.ULTRA=CEL_BANDS=4 SHADOW_TEMPORAL SHADOW_FILTER SHADOWS SHADOW_SOFTNESS=3 shadowMapResolution=4096 WATER_WAVES WATER_SPARKLE OUTLINE_FADE=160.0 BLOOM GODRAYS SSAO SSAO_STRENGTH=0.5 CLOUD_SHADOWS VOLUMETRIC_OUTDOOR=1.0 WATER_SSR CAUSTICS FXAA WET_GROUND

screen=<profile> <empty> STYLE SATURATION CLOUD_COVER FOG_STRENGTH WATER_CLARITY BLOOM_STRENGTH SHADOW_SOFTNESS FIELD_WAVES <empty> <empty> [LIGHTING] [SKY] [WATER] [FOLIAGE] [COLOR] [POST] [OUTLINE] [WORLD]
screen.LIGHTING=SHADOWS CEL_BANDS CEL_EDGE RIM_LIGHT RIM_STRENGTH GODRAYS GODRAYS_STRENGTH CANOPY_RAYS SUN_SPOTS BOUNCE_LIGHT [SHADOW] [CHARACTERS] [LIGHTS] [LIGHT_ADV]
screen.SHADOW=shadowMapResolution shadowDistance SHADOW_FILTER SHADOW_FILTER_SIZE SHADOW_TEMPORAL SHADOW_PENUMBRA SHADOW_EDGE SHADOW_DIST_SOFT SSAO SSAO_STRENGTH CLOUD_SHADOWS CLOUD_SHADOW_STRENGTH SHADOW_TINT_R SHADOW_TINT_G SHADOW_TINT_B
